name: perses
base: core22
adopt-info: perses
summary: Syntax-directed program reducer
description: |
  Perses is a language-agnostic program reducer. It minimizes a program with
  respect to a set of constraints expressed as a test script, leveraging the
  Antlr grammar to prune the search space and avoid generating syntactically
  invalid variants.

  Usage:
    perses --test-script <test-script.sh> --input-file <program-file>

  Because Perses runs the user's test script — which typically invokes system
  toolchains (gcc, clang, javac, ...) and reads and writes files at arbitrary
  paths — this snap uses classic confinement so it behaves like a normally
  installed developer tool. The store-review justification is at
  https://forum.snapcraft.io/t/classic-confinement-request-for-perses/53408.

license: GPL-3.0-or-later
grade: stable
confinement: classic

apps:
  perses:
    command: bin/perses

parts:
  # The version-controlled launcher. Kept separate from the (build-time) jar so
  # the source tree never contains a copy of the jar.
  wrapper:
    plugin: dump
    source: snap/local/wrapper
    organize:
      perses: bin/perses
    stage:
      - bin/perses

  # The fat "deploy" jar, built by Bazel and dropped into dist/ before packing.
  # See snap/local/build-snap.sh, which produces dist/perses_deploy.jar.
  perses:
    after: [wrapper]
    plugin: dump
    source: snap/local/dist
    organize:
      perses_deploy.jar: jar/perses_deploy.jar
    stage:
      - jar/perses_deploy.jar
    override-pull: |
      craftctl default
      # The VERSION file is the single source the jar's Version class is generated
      # from, so reading it here is what keeps the snap's version equal to what
      # `perses --version` reports. No override: an override is how it drifts.
      version_file="$CRAFT_PROJECT_DIR/version/org/perses/version/VERSION"
      version="$(tr -d '[:space:]' < "$version_file")"
      if [ -z "$version" ]; then
        echo "error: $version_file is missing or empty" >&2
        exit 1
      fi
      craftctl set version="$version"

  # Bundle a full JDK (not just a JRE) so users need no Java on the host AND the
  # in-process compiler API works: perses calls ToolProvider.getSystemJavaCompiler()
  # / com.sun.source.* (JavacWrapper in AntlrCompiler, and the mimir javac path),
  # which live in the jdk.compiler module absent from a headless JRE.
  jdk:
    plugin: nil
    stage-packages:
      - openjdk-17-jdk-headless
    # Debian ships lib/security/cacerts as a symlink to /etc/ssl/certs/java/cacerts,
    # a file that ca-certificates-java generates at install time. The store rejects
    # symlinks that leave the snap, so generate the keystore in the build VM (the
    # package's postinst needs a JRE present) and copy the real file into place.
    build-packages:
      - openjdk-17-jre-headless
      - ca-certificates-java
    prime:
      - -usr/lib/jvm/*/jmods          # jlink-only; javac and the compiler API work without it
    override-prime: |
      craftctl default
      cacerts=usr/lib/jvm/java-17-openjdk-amd64/lib/security/cacerts
      rm -f "$cacerts"
      cp /etc/ssl/certs/java/cacerts "$cacerts"
    # classic snaps need explicit ELF patching so the bundled JRE resolves its
    # own libraries instead of the host's.
    build-attributes:
      - enable-patchelf
