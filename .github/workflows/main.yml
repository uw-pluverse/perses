# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events.
# on: [push, pull_request]
on: [push, pull_request] 

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - name: Mount bazel cache
      uses: actions/cache@v4
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel

    # Loading + analysis of every shipped package, without executing any build
    # action. This is the boundary check: a reference to a package that only
    # exists in the private overlay fails here within seconds.
    - name: Analyze all shipped targets
      run: |
        bazelisk build --nobuild //src/... //antlropt/... //test/... //copyright/... //ppr/...

    # Builds the perses binary and smoke-runs `perses --help`.
    - name: Test Installation
      run: |
        ./scripts/test_install_perses.sh
